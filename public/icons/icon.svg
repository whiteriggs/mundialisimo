<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Complex gradients for realistic gold -->
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A6A00" />
      <stop offset="15%" stop-color="#E2B42D" />
      <stop offset="30%" stop-color="#FFF2A8" />
      <stop offset="50%" stop-color="#C58000" />
      <stop offset="70%" stop-color="#FFDD55" />
      <stop offset="85%" stop-color="#DFB129" />
      <stop offset="100%" stop-color="#5B3A00" />
    </linearGradient>
    
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2F00" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#8B5A00" stop-opacity="0"/>
      <stop offset="75%" stop-color="#8B5A00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4A2F00" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Globe textures -->
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF5C2" />
      <stop offset="40%" stop-color="#D9A814" />
      <stop offset="80%" stop-color="#8B5A00" />
      <stop offset="100%" stop-color="#3D2600" />
    </radialGradient>
    
    <radialGradient id="globeOverlay" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Malachite for the base -->
    <linearGradient id="malachite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05170A" />
      <stop offset="20%" stop-color="#1A592D" />
      <stop offset="50%" stop-color="#35A358" />
      <stop offset="80%" stop-color="#144A29" />
      <stop offset="100%" stop-color="#05170A" />
    </linearGradient>

    <!-- Deep fold parting the two figures -->
    <linearGradient id="centerSplit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2F00" stop-opacity="0"/>
      <stop offset="40%" stop-color="#5B3A00" stop-opacity="0.3"/>
      <stop offset="48%" stop-color="#2E1D00" stop-opacity="0.8"/>
      <stop offset="52%" stop-color="#2E1D00" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#5B3A00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4A2F00" stop-opacity="0"/>
    </linearGradient>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDB931" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FDB931" stop-opacity="0" />
    </radialGradient>

    <!-- Gaussian blur for the background -->
    <filter id="bgBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    
    <clipPath id="rounded">
      <rect width="512" height="512" rx="96" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0b0d10" />

  <g clip-path="url(#rounded)">
    <!-- BACKGROUND FLAGS -->
    <g opacity="0.3" transform="rotate(-45 256 256)" filter="url(#bgBlur)">
      <!-- 2022: Argentina -->
      <rect x="-150" y="-100" width="812" height="50" fill="#75AADB" />
      <rect x="-150" y="-50" width="812" height="50" fill="#FFFFFF" />
      <rect x="-150" y="0" width="812" height="50" fill="#75AADB" />

      <!-- 2018: France -->
      <rect x="-150" y="50" width="270" height="150" fill="#002395" />
      <rect x="120" y="50" width="270" height="150" fill="#FFFFFF" />
      <rect x="390" y="50" width="272" height="150" fill="#ED2939" />

      <!-- 2014: Germany -->
      <rect x="-150" y="200" width="812" height="50" fill="#222222" />
      <rect x="-150" y="250" width="812" height="50" fill="#DD0000" />
      <rect x="-150" y="300" width="812" height="50" fill="#FFCE00" />

      <!-- 2010: Spain -->
      <rect x="-150" y="350" width="812" height="37.5" fill="#AA151B" />
      <rect x="-150" y="387.5" width="812" height="75" fill="#F1BF00" />
      <rect x="-150" y="462.5" width="812" height="37.5" fill="#AA151B" />

      <!-- 2006: Italy -->
      <rect x="-150" y="500" width="270" height="150" fill="#009246" />
      <rect x="120" y="500" width="270" height="150" fill="#FFFFFF" />
      <rect x="390" y="500" width="272" height="150" fill="#CE2B37" />
    </g>
  </g>

  <!-- Glow behind trophy -->
  <circle cx="256" cy="250" r="190" fill="url(#glow)" />

  <!-- TROPHY -->
  <g transform="translate(0, -10)">
  
    <!-- Green Base layer 1 (Bottom) -->
    <path d="M 180,455 C 180,475 332,475 332,455 L 320,425 C 320,422 192,422 192,425 Z" fill="url(#malachite)"/>
    <path d="M 180,455 C 180,475 332,475 332,455 C 332,470 180,470 180,455 Z" fill="#06170A" opacity="0.6"/>

    <!-- Gold band -->
    <path d="M 192,425 C 192,435 320,435 320,425 L 310,405 C 310,405 202,405 202,405 Z" fill="url(#goldBody)"/>

    <!-- Green Base layer 2 (Top) -->
    <path d="M 202,405 C 202,415 310,415 310,405 L 302,385 C 302,385 210,385 210,385 Z" fill="url(#malachite)"/>
    <path d="M 202,405 C 202,415 310,415 310,405 C 310,412 202,412 202,405 Z" fill="#06170A" opacity="0.6"/>

    <!-- Globe (Earth) - drawn behind arms to sit inside them -->
    <g transform="translate(0, 5)">
      <circle cx="256" cy="130" r="62" fill="url(#globeGrad)" />
      
      <!-- Engraved continents (rough stylized blobs) -->
      <path d="M 215,100 C 235,90 255,105 265,115 C 280,140 285,170 265,185 C 255,195 240,190 230,175 C 215,155 205,140 210,120 C 212,110 210,105 215,100 Z" fill="#996000" opacity="0.35" />
      <path d="M 280,95 C 295,90 310,105 315,125 C 320,140 310,150 295,155 C 280,165 270,145 265,130 C 260,115 265,100 280,95 Z" fill="#996000" opacity="0.35" />
      
      <!-- 3D spherical depth & overlays -->
      <circle cx="256" cy="130" r="62" fill="none" stroke="#4A2F00" stroke-width="3" opacity="0.5" />
      <circle cx="256" cy="130" r="62" fill="url(#globeOverlay)" />
      <!-- Highlight crescent -->
      <path d="M 210,95 C 235,70 270,70 295,90 C 260,82 230,95 210,125 C 206,115 207,105 210,95 Z" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- Main Body Figures -->
    <g transform="translate(0, 5)">
      <!-- Overall cup silhouette -->
      <path d="M 210,380
               C 210,320 230,285 230,230
               C 230,185 185,160 190,120
               C 210,170 256,185 256,185
               C 256,185 302,170 322,120
               C 327,160 282,185 282,230
               C 282,285 302,320 302,380 Z" fill="url(#goldBody)"/>
      
      <!-- Edge Shadows for cylindrical shape -->
      <path d="M 210,380
               C 210,320 230,285 230,230
               C 230,185 185,160 190,120
               C 210,170 256,185 256,185
               C 256,185 302,170 322,120
               C 327,160 282,185 282,230
               C 282,285 302,320 302,380 Z" fill="url(#goldShadow)"/>
               
      <!-- Center seam to distinct the two figures holding the globe -->
      <path d="M 210,380
               C 210,320 230,285 230,230
               C 230,185 185,160 190,120
               C 210,170 256,185 256,185
               C 256,185 302,170 322,120
               C 327,160 282,185 282,230
               C 282,285 302,320 302,380 Z" fill="url(#centerSplit)"/>

      <!-- Inner spiral highlights mimicking arms/bodies wrapping -->
      <path d="M 218,375 C 225,320 242,285 245,230 C 248,185 205,155 198,135" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round"/>
      <path d="M 294,375 C 287,320 270,285 267,230 C 264,185 307,155 314,135" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round"/>
      
      <path d="M 235,375 C 238,320 250,285 252,230 C 254,185 220,165 220,145" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.15" stroke-linecap="round"/>
      <path d="M 277,375 C 274,320 262,285 260,230 C 258,185 292,165 292,145" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.15" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 2026 text centered at the bottom of the base -->
  <text x="256" y="490" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#FDB931" opacity="0.9" text-anchor="middle" letter-spacing="2">2026</text>
</svg>
