name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Rebuild diario como BACKUP: la web lee los partidos en vivo del Cloudflare
    # Worker (LIVE_MATCHES_URL) y calcula la clasificación en el cliente cada 12s,
    # así que NO hace falta rebuild para los directos. Este cron solo refresca el
    # matches.json de fallback (para cuando el Worker esté caído). Antes era */5
    # (24/7), que se comía ~576 min/día de Actions.
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}
          NEXT_PUBLIC_GNEWS_API_KEY: ${{ secrets.NEXT_PUBLIC_GNEWS_API_KEY }}
          NEXT_PUBLIC_LIVE_MATCHES_URL: ${{ vars.LIVE_MATCHES_URL }}
          NEXT_PUBLIC_BUILD_RUN: ${{ github.run_number }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
